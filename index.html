<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://imgcdn.stablediffusionweb.com/2024/5/7/76668f77-df48-4d04-a91e-6feeb073bcd5.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-container shadow px-5 ">
        <h5 class="text-center my-4">Login to your Account</h5>
        <form>
            <div class="mb-3 mt-1">
                <label for="Username" class="form-label">Username / Phone number</label>
                <input type="text" class="form-control" id="Username" placeholder="Enter your Username/phone number" required>
            </div>
            <div class="mb-3 mt-1">
                <label for="password" class="form-label"5>Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div class="text-center d-flex justify-content-around align-items-center mt-3">
                <a href="#">Forgot password?</a>
            </div>
            <div
                class="text-center d-flex justify-content-around align-items-center mt-2">
                    <span class="fw-bold">Or</span>
            </div>
<div class="text-center mt-3">
    <p class="fw-bold">Login with</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="#" class="btn btn-outline-dark btn-sm rounded-circle">
            <i class="bi bi-google fs-6"></i>
        </a>
        <a href="#" class="btn btn-outline-primary btn-sm rounded-circle">
            <i class="bi bi-facebook fs-6"></i>
        </a>
        <a href="#" class="btn btn-outline-secondary btn-sm rounded-circle">
            <i class="bi bi-envelope fs-6"></i>
        </a>
    </div>
    <div class="text-center mt-4">
        <span>Don't have an account? <a href="#">Sign up</a></span>
        </div>
        <div class="text-center mt-4">
            <p class="text-muted">&copy; 2025 All rights reserved.</p>

</html>
